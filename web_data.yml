--- 
- name: create web data playbook
  hosts: prod
  tasks:

    - name: install httpd pks
      yum:
        name: httpd
        state: present

    - name: create /web directory
      file:
        path: /web
        group: ansi_user
        mode: '2775'
        state: directory
        setype: httpd_sys_content_t

    - name: create index.html file
      lineinfile:
        path: /web/index.html
        create: yes
        setype: httpd_sys_content_t
        line: "Development in progress"

    - name: create link
      file:
        src: /web
        dest: /var/www/html/web
        state: link
